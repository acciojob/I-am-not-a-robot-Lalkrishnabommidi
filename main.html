<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm not a robot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h3 id="h">Please click on the identical tiles to verify that you are not a robot.</h3>

    <div id="images">
      <img class="tile" src="https://picsum.photos/id/101/100/100" alt="tile">
      <img class="tile" src="https://picsum.photos/id/102/100/100" alt="tile">
      <img class="tile" src="https://picsum.photos/id/103/100/100" alt="tile">
      <img class="tile" src="https://picsum.photos/id/104/100/100" alt="tile">
      <img class="tile" src="https://picsum.photos/id/105/100/100" alt="tile">
      <img class="tile" src="https://picsum.photos/id/106/100/100" alt="tile">
    </div>

    <button id="reset" style="display: none;">Reset</button>
    <button id="verify" style="display: none;">Verify</button>

    <p id="para"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
